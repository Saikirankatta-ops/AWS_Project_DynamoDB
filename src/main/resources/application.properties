spring.application.name=cravedash
server.port=${PORT:8080}

app.dynamodb.region=${AWS_REGION:us-east-1}
app.dynamodb.endpoint=${DYNAMODB_ENDPOINT:}
app.dynamodb.table-name=${DYNAMODB_TABLE_NAME:CraveDashData}
app.dynamodb.auto-create-tables=${DYNAMODB_AUTO_CREATE_TABLES:false}

spring.jackson.serialization.write-dates-as-timestamps=false

app.auth.bootstrap-username=${CRAVEDASH_AUTH_USERNAME:}
app.auth.bootstrap-password=${CRAVEDASH_AUTH_PASSWORD:}
app.auth.secure-cookie=${CRAVEDASH_SECURE_COOKIE:false}
app.frontend-origin=${CRAVEDASH_FRONTEND_ORIGIN:http://localhost:5173}
